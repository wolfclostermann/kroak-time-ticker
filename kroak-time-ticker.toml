# kroak-time-ticker configuration
# Set upstream_url to point at your kroak-time /api/state endpoint.

[server]
port = 8080
bind_address = "0.0.0.0"

[ticker]
upstream_url = "http://localhost:8765/api/state"
singer_count = 0
poll_interval_ms = 1500

[ngrok]
# Uses its own dedicated ngrok account (separate from Mervyn's), so no
# concurrent-endpoint conflict.
enabled = true
# authtoken left blank on purpose: set NGROK_AUTHTOKEN in .env (gitignored) instead
# of committing the secret here.
authtoken = ""
domain = "cortex-prompter-refract.ngrok-free.dev"
