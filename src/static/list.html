<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kroak-time Rotation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Kroak theme (dark) — matches kroak-time's "Kroak" appearance preset:
     window_bg/panel_bg/border/foreground/alt_foreground/accent from
     ChromeColors::kroak_dark_defaults(), now/next from
     RotationColors::kroak_dark_defaults() (top_of_rotation / selected_background). */
  :root {
    --bg:        #09120b;
    --surface:   #142017;
    --border:    #242e26;
    --now-color: #d9a514;
    --next-color:#009ca5;
    --text:      #e3eae4;
    --muted:     #909c92;
    --dim:       #5a655c;
    --accent:    #54b05a;
    --tiktok-pink: #fe2c55;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    min-height: 100vh;
    padding: 24px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  #status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  #status-dot.ok   { background: #4caf50; }
  #status-dot.warn { background: #e6a23c; }
  #status-dot.err  { background: #b03030; }

  .queue-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 20px;
    font-size: 15px;
    line-height: 1.5;
  }

  .queue-banner .info { font-weight: 700; color: var(--accent); }
  .queue-banner .fair { color: var(--muted); font-style: italic; margin-left: 10px; }

  .cta-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .cta-request {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--accent);
    color: #04170a;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.02em;
    text-decoration: none;
    border-radius: 10px;
    padding: 16px 20px;
    flex: 1;
    min-width: 200px;
    animation: cta-pulse 2s ease-in-out infinite;
  }

  .cta-request:hover { filter: brightness(1.08); }

  @keyframes cta-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(84, 176, 90, 0.5); }
    50%      { box-shadow: 0 0 0 10px rgba(84, 176, 90, 0); }
  }

  .cta-tiktok {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    text-decoration: none;
    border-radius: 10px;
    padding: 16px 20px;
    flex: 1;
    min-width: 200px;
  }

  .cta-tiktok:hover { border-color: var(--tiktok-pink); }

  .cta-tiktok .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--tiktok-pink);
    animation: live-pulse 1.4s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes live-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  .hero {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 22px;
    flex: 1;
    min-width: 220px;
  }

  .hero-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .hero-card .name {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hero-card .song {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hero-card.now  { border-color: rgba(217, 165, 20, 0.35); }
  .hero-card.now  .label { color: var(--now-color); }
  .hero-card.now  .name  { color: var(--now-color); }

  .hero-card.next { border-color: rgba(0, 156, 165, 0.3); }
  .hero-card.next .label { color: var(--next-color); }
  .hero-card.next .name  { color: var(--next-color); }

  .empty-hero { color: var(--dim); font-style: italic; }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    text-align: left;
    padding: 8px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  tbody tr:hover { background: rgba(255,255,255,0.03); }

  tbody tr.row-now  { background: rgba(217, 165, 20, 0.06); }
  tbody tr.row-next { background: rgba(0, 156, 165, 0.05); }

  td {
    padding: 12px 14px;
    vertical-align: middle;
  }

  tbody td:first-child {
    white-space: nowrap;
  }

  .badge {
    display: inline-block;
    border-radius: 5px;
    padding: 2px 9px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    white-space: nowrap;
    min-width: 36px;
    text-align: center;
  }

  .badge-now  { background: rgba(217,165,20,0.18); color: var(--now-color);  border: 1px solid rgba(217,165,20,0.35); }
  .badge-next { background: rgba(0,156,165,0.15);  color: var(--next-color); border: 1px solid rgba(0,156,165,0.3); }
  .badge-num  { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

  .sing-time {
    color: var(--accent);
    font-weight: 800;
    font-size: 15px;
    margin-left: 8px;
  }

  .singer-name { font-weight: 600; }

  .song-title  { color: var(--muted); }
  .song-artist { color: var(--dim); }
  .no-song     { color: var(--dim); font-style: italic; font-size: 13px; }

  #empty-msg {
    text-align: center;
    padding: 60px;
    color: var(--dim);
    font-style: italic;
  }

  footer {
    margin-top: 20px;
    font-size: 11px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }

  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--muted); }
</style>
</head>
<body>

<header>
  <div id="status-dot"></div>
</header>

<div class="queue-banner" id="queue-banner" hidden>
  <span class="info" id="queue-banner-info"></span>
  <span class="fair" id="queue-banner-fair"></span>
</div>

<div class="cta-row">
  <a class="cta-request" id="cta-request" href="https://linktr.ee/wolflike" target="_blank" rel="noopener noreferrer">
    Request your song
  </a>
  <a class="cta-tiktok" href="https://tiktok.com/@lordjohnrussell/live" target="_blank" rel="noopener noreferrer">
    <span class="live-dot"></span>Watch live on TikTok
  </a>
</div>

<div class="hero">
  <div class="hero-card now" id="card-now">
    <div class="label">Now Singing</div>
    <div class="name empty-hero" id="now-name">—</div>
    <div class="song" id="now-song"></div>
  </div>
  <div class="hero-card next" id="card-next">
    <div class="label">Next Up</div>
    <div class="name empty-hero" id="next-name">—</div>
    <div class="song" id="next-song"></div>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th style="width:120px">#</th>
      <th>Singer</th>
      <th>Next Song</th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="3" id="empty-msg">Loading…</td></tr>
  </tbody>
</table>

<footer>
  <span id="last-updated"></span>
</footer>

<script>
  const TICKER_CFG = __TICKER_CFG__;

  // "Request your song" button: TICKER_CFG.show_request_button sets the
  // default (true unless configured off); ?request=0/1 (also accepts
  // false/off/no and true/on/yes) overrides it per-view either way.
  (function () {
    let show = TICKER_CFG.show_request_button !== false;
    const val = new URLSearchParams(location.search).get('request');
    if (val !== null) {
      const v = val.toLowerCase();
      if (['0', 'false', 'off', 'no'].includes(v)) show = false;
      else if (['1', 'true', 'on', 'yes'].includes(v)) show = true;
    }
    if (!show) document.getElementById('cta-request').hidden = true;
  })();

  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── Singer timing (kroak-time's sings_in_secs / sings_at) ───────────────────
  const singCfg      = TICKER_CFG.sing_time || {};
  const showSingTime = !!(singCfg.enabled && singCfg.show_per_singer);

  // ── Queue banner (singer count + estimated queue time + fairness note) ──────
  // Same wording as the ticker's queue-info banner and fairness note on /scroll.
  function formatDurationPrecise(totalSeconds) {
    const mins  = Math.max(0, Math.round(totalSeconds / 60));
    const h     = Math.floor(mins / 60);
    const m     = mins % 60;
    const parts = [];
    if (h > 0) parts.push(`${h} hour${h === 1 ? '' : 's'}`);
    if (m > 0 || h === 0) parts.push(`${m} minute${m === 1 ? '' : 's'}`);
    return parts.join(' ');
  }

  function formatDurationRounded(totalSeconds) {
    const mins    = Math.max(0, Math.round(totalSeconds / 60));
    const rounded = Math.round(mins / 15) * 15;
    const h       = Math.floor(rounded / 60);
    const q       = rounded % 60; // 0, 15, 30, 45

    if (h === 0 && q === 0) return 'no time';
    const hourPhrase = h === 1 ? 'an hour' : `${h} hours`;

    if (h === 0) {
      return q === 30 ? 'about half an hour' : `about ${q} minutes`;
    }
    if (q === 0)  return `about ${hourPhrase}`;
    if (q === 30) return `about ${hourPhrase} and a half`;
    return `about ${hourPhrase} and ${q} minutes`;
  }

  function formatQueueDuration(totalSeconds, cfg) {
    return cfg.precise_duration
      ? formatDurationPrecise(totalSeconds)
      : formatDurationRounded(totalSeconds);
  }

  function queueBannerInfoText(s) {
    const cfg      = TICKER_CFG.queue_info || {};
    const count    = s.rotation ? s.rotation.length : 0;
    const timeStr  = formatQueueDuration(s.queue_duration_secs || 0, cfg);
    const countTxt = (cfg.count_legend || '{count} singers').replace('{count}', count);
    const timeTxt  = (cfg.time_legend  || '{time} to get through the queue').replace('{time}', timeStr);
    return `${countTxt} · ${timeTxt}`;
  }

  function queueBannerFairText() {
    let text = 'The queue order will change to make sure everyone gets a fair turn';
    if (showSingTime) text += ' — times shown are estimated and will change';
    return text;
  }

  // Renders as "15m" / "1h20m" (relative) or "21:42" (clock); "now" for 0;
  // null when timing is off upstream, the singer has no estimate, or the
  // feature is disabled in config.
  function formatSingTime(singer) {
    if (!singCfg.enabled) return null;
    const secs = singer.sings_in_secs;
    if (secs == null || singer.sings_at == null) return null;

    if (singCfg.format === 'clock') {
      const d  = new Date(singer.sings_at * 1000);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    if (secs <= 0) return 'now';
    const mins = Math.round(secs / 60);
    const h    = Math.floor(mins / 60);
    const m    = mins % 60;
    if (h === 0) return m === 0 ? '<1m' : `${m}m`;
    return m === 0 ? `${h}h` : `${h}h${m}m`;
  }

  // Shown right next to the row's number/NOW/NEXT badge, in the same cell.
  function singTimeBadge(singer) {
    if (!showSingTime) return '';
    const label = formatSingTime(singer);
    return label ? `<span class="sing-time">${esc(label)}</span>` : '';
  }

  function songDisplay(singer) {
    if (!singer || !singer.next_song_title) return null;
    let s = esc(singer.next_song_title);
    if (singer.next_song_artist) s += ` — ${esc(singer.next_song_artist)}`;
    return s;
  }

  function setCard(nameEl, songEl, singer, emptyText) {
    if (singer) {
      nameEl.textContent = singer.name;
      nameEl.classList.remove('empty-hero');
      const song = songDisplay(singer);
      songEl.innerHTML = song
        ? `<span class="song-title">${song}</span>`
        : '';
    } else {
      nameEl.textContent = emptyText || '—';
      nameEl.classList.toggle('empty-hero', !emptyText);
      songEl.innerHTML = '';
    }
  }

  async function update() {
    const dot    = document.getElementById('status-dot');
    const banner = document.getElementById('queue-banner');

    try {
      const r = await fetch('/api/state');
      const s = await r.json();

      if (s.status === 'not_ready' || s.status === 'database_not_found') {
        dot.className = 'warn';
        banner.hidden = true;
        document.getElementById('now-name').textContent = '—';
        document.getElementById('next-name').textContent = '—';
        document.getElementById('tbody').innerHTML =
          `<tr><td colspan="3" id="empty-msg" style="color:#e6a23c">` +
          (s.status === 'database_not_found'
            ? 'Upstream not reachable — is kroak-time running?'
            : 'Waiting for data…') +
          `</td></tr>`;
        return;
      }

      dot.className = 'ok';
      banner.hidden = false;
      document.getElementById('queue-banner-info').textContent = queueBannerInfoText(s);
      document.getElementById('queue-banner-fair').textContent = queueBannerFairText();

      // When playing: current_singer is "Now Singing", next_up is "Up Next".
      // Between songs: current_singer (top of rotation) is "Up Next", "Now Singing" is empty.
      const nowSinger  = s.is_playing ? s.current_singer : null;
      const nextSinger = s.is_playing ? s.next_up : s.current_singer;

      const nowName  = nowSinger?.name;
      const nextName = nextSinger?.name;

      const rotation = TICKER_CFG.show_empty_singers
        ? (s.rotation || [])
        : (s.rotation || []).filter(r => r.next_song_title || r.name === nowName || r.name === nextName);

      const tbody = document.getElementById('tbody');

      if (rotation.length === 0) {
        const nextText  = TICKER_CFG.empty_next_text || 'Your Name Could Be Here';
        const thenItems = (TICKER_CFG.empty_then_text && TICKER_CFG.empty_then_text.length)
          ? TICKER_CFG.empty_then_text
          : ['Just scan the QR code', 'Or Fill Out A Slip'];

        setCard(document.getElementById('now-name'), document.getElementById('now-song'), nowSinger);
        setCard(document.getElementById('next-name'), document.getElementById('next-song'), nextSinger, nextText);

        tbody.innerHTML = thenItems.map((t, i) => `<tr>
          <td><span class="badge badge-num">${i + 1}</span></td>
          <td colspan="2"><span class="singer-name">${esc(t)}</span></td>
        </tr>`).join('');

        document.getElementById('last-updated').textContent =
          `Updated ${new Date().toLocaleTimeString()}`;
        return;
      }

      setCard(document.getElementById('now-name'), document.getElementById('now-song'), nowSinger);
      setCard(document.getElementById('next-name'), document.getElementById('next-song'), nextSinger);

      tbody.innerHTML = rotation.map((singer, i) => {
        const isNow  = s.is_playing && singer.is_current;
        const isNext = !isNow && singer.name === nextName;

        let rowClass  = isNow ? ' class="row-now"' : (isNext ? ' class="row-next"' : '');
        let badgeHtml;
        if (isNow)       badgeHtml = `<span class="badge badge-now">NOW</span>`;
        else if (isNext) badgeHtml = `<span class="badge badge-next">NEXT</span>`;
        else             badgeHtml = `<span class="badge badge-num">${i + 1}</span>`;

        const songTitle  = singer.next_song_title;
        const songArtist = singer.next_song_artist;
        let songHtml;
        if (songTitle) {
          songHtml = `<span class="song-title">${esc(songTitle)}</span>`;
          if (songArtist) songHtml += ` <span class="song-artist">— ${esc(songArtist)}</span>`;
        } else {
          songHtml = `<span class="no-song">no song queued</span>`;
        }

        return `<tr${rowClass}>
          <td>${badgeHtml}${isNow ? '' : singTimeBadge(singer)}</td>
          <td><span class="singer-name">${esc(singer.name)}</span></td>
          <td>${songHtml}</td>
        </tr>`;
      }).join('');

      document.getElementById('last-updated').textContent =
        `Updated ${new Date().toLocaleTimeString()}`;

    } catch (_) {
      dot.className = 'err';
    }
  }

  update();
  setInterval(update, 1500);
</script>
</body>
</html>
