<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>kroak-time Scroll</title>
<!-- Visual properties are set via the [scroll] section of kroak-time-ticker.toml. -->
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
  }

  .scroll-container {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1920px;
    overflow: hidden;
  }

  #scroll-track {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    white-space: nowrap;
    will-change: transform;
  }

  .seg        { display: inline-block; padding: 0 40px; }
  .lbl-now    { font-weight: 700; margin-right: 14px; }
  .lbl-next   { font-weight: 700; margin-right: 14px; }
  .lbl-up     { font-weight: 700; margin-right: 14px; }
  .singer-name{ font-weight: 600; }
  .song-title { font-style: italic; }
  .dot        { color: #555; margin: 0 10px; }
  .pipe       { color: #333; margin: 0 6px; }
  .up-num     { color: #666; margin-right: 6px; }
  .up-singer  { font-weight: 600; }
  .up-song    { font-style: italic; font-size: 0.85em; margin-left: 12px; }
  .fairness-note { color: #aaa; font-style: italic; }
  .sing-time  {
    font-weight: 800;
    font-size: 1.15em;
    margin-right: 12px;
  }
</style>
</head>
<body>
<div class="scroll-container" id="container">
  <div id="scroll-track">Starting...</div>
</div>

<script>
  // ── Config (injected from kroak-time-ticker.toml at server startup) ──
  const SCROLL_CFG = __SCROLL_CFG__;
  const TICKER_CFG = __TICKER_CFG__;

  // Apply layout/style from config.
  const container = document.getElementById('container');
  container.style.height     = SCROLL_CFG.height + 'px';
  container.style.background = SCROLL_CFG.bg;
  container.style.fontFamily = SCROLL_CFG.font;
  container.style.fontSize   = SCROLL_CFG.size + 'px';

  // Inject color rules so the class rules pick them up.
  document.head.insertAdjacentHTML('beforeend', `<style>
    .lbl-now    { color: ${SCROLL_CFG.color_now};    }
    .lbl-next   { color: ${SCROLL_CFG.color_next};   }
    .lbl-up     { color: ${SCROLL_CFG.color_up};     }
    .singer-name{ color: ${SCROLL_CFG.color_singer}; }
    .song-title { color: ${SCROLL_CFG.color_song};   }
    .song-artist{ color: ${SCROLL_CFG.color_artist}; }
    .up-singer  { color: ${SCROLL_CFG.color_singer}; }
    .up-song    { color: ${SCROLL_CFG.color_artist}; }
    .lbl-info   { color: ${SCROLL_CFG.color_info};   font-weight: 700; margin-right: 14px; }
    .sing-time  { color: ${SCROLL_CFG.color_info}; }
  </style>`);

  // ── Scroll state ──────────────────────────────────────────────────────────
  const FETCH_MS = 1500;
  const track    = document.getElementById('scroll-track');

  let scrollX       = 0;
  let halfWidth     = 0;
  let lastTs        = null;
  let pendingLayout = false;
  let state         = null;

  // ── HTML builder ──────────────────────────────────────────────────────────
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function songHtml(singer) {
    if (!singer.next_song_title) return '';
    let s = `<span class="dot">·</span><span class="song-title">${esc(singer.next_song_title)}</span>`;
    if (singer.next_song_artist) {
      s += ` <span class="song-artist">by ${esc(singer.next_song_artist)}</span>`;
    }
    return s;
  }

  // The fairness note doubles as the disclaimer for singing-time estimates
  // (when shown): both boil down to "the order/times you see now will move".
  function fairnessSegHtml(singCfg) {
    let text = 'The queue order will change to make sure everyone gets a fair turn';
    if (singCfg && singCfg.enabled && (singCfg.show_per_singer || singCfg.show_in_banner)) {
      text += ' — times shown are estimated and will change';
    }
    return `<span class="seg fairness-note">${esc(text)}</span>`;
  }

  // ── Singer timing (kroak-time's sings_in_secs / sings_at) ───────────────────

  // Renders as "15m" / "1h20m" (relative) or "21:42" (clock); "now" for 0;
  // null when timing is off upstream, the singer has no estimate, or the
  // feature is disabled in config.
  function formatSingTime(singer, singCfg) {
    if (!singCfg || !singCfg.enabled) return null;
    const secs = singer.sings_in_secs;
    if (secs == null || singer.sings_at == null) return null;

    if (singCfg.format === 'clock') {
      const d  = new Date(singer.sings_at * 1000);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    if (secs <= 0) return 'now';
    const mins = Math.round(secs / 60);
    const h    = Math.floor(mins / 60);
    const m    = mins % 60;
    if (h === 0) return m === 0 ? '<1m' : `${m}m`;
    return m === 0 ? `${h}h` : `${h}h${m}m`;
  }

  function singTimeHtml(singer, singCfg) {
    if (!singCfg || !singCfg.show_per_singer) return '';
    const label = formatSingTime(singer, singCfg);
    return label ? `<span class="sing-time">${esc(label)}</span>` : '';
  }

  // Short "up next" callout for the queue-info banner, naming whoever is
  // about to appear right after it in the scroll.
  function bannerSingTimeHtml(singer, singCfg) {
    if (!singer || !singCfg || !singCfg.show_in_banner) return '';
    const label = formatSingTime(singer, singCfg);
    if (!label) return '';
    const phrase = label === 'now' ? 'up now' : `up ${singCfg.format === 'clock' ? 'at' : 'in'} ${esc(label)}`;
    return `<span class="seg sing-time">${esc(singer.name)} ${phrase}</span>`;
  }

  // ── Queue info (singer count + estimated queue time) ───────────────────────
  //
  // Placement is positional, computed fresh on every render — NOT tied to
  // real-world singer turnover across polls. show_at_start puts one banner
  // before NOW/NEXT; show_every_n_singers then splices another in after
  // every Nth displayed entry (NOW and NEXT each count as one entry too,
  // same as their position in the THEN numbering).

  function formatDurationPrecise(totalSeconds) {
    const mins  = Math.max(0, Math.round(totalSeconds / 60));
    const h     = Math.floor(mins / 60);
    const m     = mins % 60;
    const parts = [];
    if (h > 0) parts.push(`${h} hour${h === 1 ? '' : 's'}`);
    if (m > 0 || h === 0) parts.push(`${m} minute${m === 1 ? '' : 's'}`);
    return parts.join(' ');
  }

  function formatDurationRounded(totalSeconds) {
    const mins    = Math.max(0, Math.round(totalSeconds / 60));
    const rounded = Math.round(mins / 15) * 15;
    const h       = Math.floor(rounded / 60);
    const q       = rounded % 60; // 0, 15, 30, 45

    if (h === 0 && q === 0) return 'no time';
    const hourPhrase = h === 1 ? 'an hour' : `${h} hours`;

    if (h === 0) {
      return q === 30 ? 'about half an hour' : `about ${q} minutes`;
    }
    if (q === 0)  return `about ${hourPhrase}`;
    if (q === 30) return `about ${hourPhrase} and a half`;
    return `about ${hourPhrase} and ${q} minutes`;
  }

  function formatQueueDuration(totalSeconds, cfg) {
    return cfg.precise_duration
      ? formatDurationPrecise(totalSeconds)
      : formatDurationRounded(totalSeconds);
  }

  function queueInfoHtml(s, cfg) {
    const count    = s.rotation ? s.rotation.length : 0;
    const timeStr  = formatQueueDuration(s.queue_duration_secs || 0, cfg);
    const countTxt = (cfg.count_legend || '{count} singers in the queue').replace('{count}', count);
    const timeTxt  = (cfg.time_legend  || 'about {time} to get through the queue').replace('{time}', timeStr);
    return `<span class="seg"><span class="lbl-info">${esc(SCROLL_CFG.label_info)}</span>` +
      `<span class="singer-name">${esc(countTxt)}</span>` +
      `<span class="pipe">·</span>` +
      `<span class="song-artist">${esc(timeTxt)}</span></span>`;
  }

  function buildEmptyContent() {
    const nextText  = TICKER_CFG.empty_next_text || 'Your Name Could Be Here';
    const thenItems = (TICKER_CFG.empty_then_text && TICKER_CFG.empty_then_text.length)
      ? TICKER_CFG.empty_then_text
      : ['Just scan the QR code', 'Or Fill Out A Slip'];

    const nextSeg = `<span class="seg"><span class="lbl-next">${esc(SCROLL_CFG.label_next)}</span>` +
      `<span class="singer-name">${esc(nextText)}</span></span>`;

    const thenEntries = thenItems.map(t => `<span class="up-singer">${esc(t)}</span>`).join('<span class="pipe">  </span>');
    const thenSeg = `<span class="seg"><span class="lbl-up">${esc(SCROLL_CFG.label_up)}</span>${thenEntries}</span>`;

    return [nextSeg, thenSeg, fairnessSegHtml(TICKER_CFG.sing_time)].join('<span class="pipe">◆</span>');
  }

  function buildContent(s) {
    if (!s || s.status === 'not_ready' || s.status === 'database_not_found') {
      return '<span class="seg" style="color:#666">Waiting for kroak-time…</span>';
    }

    if (!s.rotation || s.rotation.length === 0) {
      return buildEmptyContent();
    }

    const cfg     = TICKER_CFG.queue_info;
    const singCfg = TICKER_CFG.sing_time;
    const skipNames = new Set();

    const nowSinger  = (s.is_playing && s.current_singer) ? s.current_singer : null;
    if (nowSinger) skipNames.add(nowSinger.name);

    const nextSinger = (s.is_playing ? s.next_up : s.current_singer);
    const nextShown  = nextSinger && !skipNames.has(nextSinger.name) && (TICKER_CFG.show_empty_singers || nextSinger.next_song_title)
      ? nextSinger
      : null;
    if (nextShown) skipNames.add(nextShown.name);

    // kroak-time's own setting (s.singer_count, via /api/state) is the source of
    // truth; 0 there means unlimited. TICKER_CFG.singer_count is a local override
    // that only applies when set >0, to show fewer than kroak-time reports.
    // TICKER_CFG.show_all_singers overrides both and always shows everyone.
    const rest  = s.rotation.filter(r => !skipNames.has(r.name) && (TICKER_CFG.show_empty_singers || r.next_song_title));
    const effectiveCount = TICKER_CFG.show_all_singers
      ? 0
      : (TICKER_CFG.singer_count > 0 ? TICKER_CFG.singer_count : (s.singer_count || 0));
    const shown = effectiveCount > 0
      ? rest.slice(0, Math.max(0, effectiveCount - skipNames.size))
      : rest;

    // Every entry that will actually render, in render order — lets a banner
    // at position P name whoever's about to appear right after it
    // (displayOrder[P]), rather than always repeating the same singer.
    const displayOrder = [nowSinger, nextShown, ...shown].filter(Boolean);
    const banner = (position) => {
      const parts = [queueInfoHtml(s, cfg)];
      const upcoming = bannerSingTimeHtml(displayOrder[position], singCfg);
      if (upcoming) parts.push(upcoming);
      parts.push(fairnessSegHtml(singCfg));
      return parts;
    };

    const parts = [];
    // Position counter across the whole displayed list (NOW + NEXT + each
    // THEN entry each count as one), so the banner lands after every Nth
    // entry regardless of where NOW/NEXT push it into the THEN numbering.
    let position = 0;
    if (cfg.show_at_start) parts.push(...banner(position));

    if (nowSinger) {
      // No time shown for the current singer — it's trivially "now".
      parts.push(
        `<span class="seg"><span class="lbl-now">${esc(SCROLL_CFG.label_now)}</span>` +
        `<span class="singer-name">${esc(nowSinger.name)}</span>${songHtml(nowSinger)}</span>`
      );
      position++;
      if (cfg.show_every_n_singers > 0 && position % cfg.show_every_n_singers === 0) parts.push(...banner(position));
    }

    if (nextShown) {
      parts.push(
        `<span class="seg"><span class="lbl-next">${esc(SCROLL_CFG.label_next)}</span>${singTimeHtml(nextShown, singCfg)}` +
        `<span class="singer-name">${esc(nextShown.name)}</span>${songHtml(nextShown)}</span>`
      );
      position++;
      if (cfg.show_every_n_singers > 0 && position % cfg.show_every_n_singers === 0) parts.push(...banner(position));
    }

    // Group THEN entries into chunks that break exactly at each Nth-position
    // boundary, so the banner splices in between chunks (one "THEN" label
    // per chunk) rather than after every single name.
    let chunk = [];
    const flushChunk = () => {
      if (chunk.length === 0) return;
      parts.push(`<span class="seg"><span class="lbl-up">${esc(SCROLL_CFG.label_up)}</span>${chunk.join('<span class="pipe">  </span>')}</span>`);
      chunk = [];
    };

    shown.forEach((r, i) => {
      const num  = i + skipNames.size + 1;
      let   html = `<span class="up-num">${num}.</span>${singTimeHtml(r, singCfg)}<span class="up-singer">${esc(r.name)}</span>`;
      if (r.next_song_title) html += `<span class="up-song">${esc(r.next_song_title)}</span>`;
      chunk.push(html);
      position++;
      if (cfg.show_every_n_singers > 0 && position % cfg.show_every_n_singers === 0) {
        flushChunk();
        parts.push(...banner(position));
      }
    });
    flushChunk();

    return parts.join('<span class="pipe">◆</span>');
  }

  // ── Content update ────────────────────────────────────────────────────────
  const GAP = '<span style="display:inline-block;width:120px"></span>';

  function updateContent() {
    const html = buildContent(state);
    // Each copy carries its own trailing gap so halfWidth lands exactly at
    // the start of copy 2, making the loop reset pixel-perfect.
    track.innerHTML = html + GAP + html + GAP;
    pendingLayout = true;
    lastTs        = null; // discard the frame that includes reflow time
  }

  // ── Animation loop ────────────────────────────────────────────────────────
  function animate(ts) {
    if (pendingLayout) {
      const oldHalf = halfWidth;
      halfWidth     = track.scrollWidth / 2;
      pendingLayout = false;
      // Remap scrollX proportionally so position within the loop is preserved.
      if (oldHalf > 0 && halfWidth > 0) {
        scrollX = (scrollX % oldHalf) / oldHalf * halfWidth;
      } else if (halfWidth > 0 && scrollX >= halfWidth) {
        scrollX %= halfWidth;
      }
    }

    if (lastTs !== null && halfWidth > 0) {
      const delta = (ts - lastTs) / 1000;
      scrollX += SCROLL_CFG.speed * delta;
      if (scrollX >= halfWidth) scrollX -= halfWidth;
      track.style.transform = `translateY(-50%) translateX(${-scrollX}px)`;
    }

    lastTs = ts;
    requestAnimationFrame(animate);
  }

  // ── Data fetching ─────────────────────────────────────────────────────────
  async function fetchState() {
    try {
      const r    = await fetch('/api/state');
      const next = await r.json();
      if (JSON.stringify(next) !== JSON.stringify(state)) {
        state = next;
        updateContent();
      }
    } catch (_) {
      // Server temporarily unreachable — keep showing last state.
    }
  }

  requestAnimationFrame(animate);
  fetchState();
  setInterval(fetchState, FETCH_MS);
</script>
</body>
</html>
