<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>kroak-time Scroll</title>
<!-- Visual properties are set via the [scroll] section of kroak-time-ticker.toml. -->
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
  }

  .scroll-container {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1920px;
    overflow: hidden;
  }

  #scroll-track {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    white-space: nowrap;
    will-change: transform;
  }

  .seg        { display: inline-block; padding: 0 40px; }
  .lbl-now    { font-weight: 700; margin-right: 14px; }
  .lbl-next   { font-weight: 700; margin-right: 14px; }
  .lbl-up     { font-weight: 700; margin-right: 14px; }
  .singer-name{ font-weight: 600; }
  .song-title { font-style: italic; }
  .dot        { color: #555; margin: 0 10px; }
  .pipe       { color: #333; margin: 0 6px; }
  .up-num     { color: #666; margin-right: 6px; }
  .up-singer  { font-weight: 600; }
  .up-song    { font-style: italic; font-size: 0.85em; margin-left: 12px; }
  .fairness-note { color: #aaa; font-style: italic; }
</style>
</head>
<body>
<div class="scroll-container" id="container">
  <div id="scroll-track">Starting...</div>
</div>

<script>
  // ── Config (injected from kroak-time-ticker.toml at server startup) ──
  const cfg        = __SCROLL_CFG__;
  const TICKER_CFG = __TICKER_CFG__;

  // Apply layout/style from config.
  const container = document.getElementById('container');
  container.style.height     = cfg.height + 'px';
  container.style.background = cfg.bg;
  container.style.fontFamily = cfg.font;
  container.style.fontSize   = cfg.size + 'px';

  // Inject color rules so the class rules pick them up.
  document.head.insertAdjacentHTML('beforeend', `<style>
    .lbl-now    { color: ${cfg.color_now};    }
    .lbl-next   { color: ${cfg.color_next};   }
    .lbl-up     { color: ${cfg.color_up};     }
    .singer-name{ color: ${cfg.color_singer}; }
    .song-title { color: ${cfg.color_song};   }
    .song-artist{ color: ${cfg.color_artist}; }
    .up-singer  { color: ${cfg.color_singer}; }
    .up-song    { color: ${cfg.color_artist}; }
    .lbl-info   { color: ${cfg.color_info};   font-weight: 700; margin-right: 14px; }
  </style>`);

  // ── Scroll state ──────────────────────────────────────────────────────────
  const FETCH_MS = 1500;
  const track    = document.getElementById('scroll-track');

  let scrollX       = 0;
  let halfWidth     = 0;
  let lastTs        = null;
  let pendingLayout = false;
  let state         = null;

  // ── HTML builder ──────────────────────────────────────────────────────────
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function songHtml(singer) {
    if (!singer.next_song_title) return '';
    let s = `<span class="dot">·</span><span class="song-title">${esc(singer.next_song_title)}</span>`;
    if (singer.next_song_artist) {
      s += ` <span class="song-artist">by ${esc(singer.next_song_artist)}</span>`;
    }
    return s;
  }

  const FAIRNESS_SEG = '<span class="seg fairness-note">The queue order will change to make sure everyone gets a fair turn</span>';

  // ── Queue info (singer count + estimated queue time) ───────────────────────

  let queueInfoShownOnce = false;
  let singersSinceInfo   = 0;
  let lastCurrentName; // undefined until the first real state arrives

  function trackSingerAdvance(s) {
    const curName = (s && s.current_singer) ? s.current_singer.name : null;
    if (lastCurrentName === undefined) {
      lastCurrentName = curName;
      return;
    }
    if (curName !== lastCurrentName) {
      singersSinceInfo++;
      lastCurrentName = curName;
    }
  }

  function shouldShowQueueInfo(cfg) {
    if (!queueInfoShownOnce && cfg.show_at_start) {
      queueInfoShownOnce = true;
      singersSinceInfo   = 0;
      return true;
    }
    if (cfg.show_every_n_singers > 0 && singersSinceInfo >= cfg.show_every_n_singers) {
      queueInfoShownOnce = true;
      singersSinceInfo   = 0;
      return true;
    }
    return false;
  }

  function formatDurationPrecise(totalSeconds) {
    const mins  = Math.max(0, Math.round(totalSeconds / 60));
    const h     = Math.floor(mins / 60);
    const m     = mins % 60;
    const parts = [];
    if (h > 0) parts.push(`${h} hour${h === 1 ? '' : 's'}`);
    if (m > 0 || h === 0) parts.push(`${m} minute${m === 1 ? '' : 's'}`);
    return parts.join(' ');
  }

  function formatDurationRounded(totalSeconds) {
    const mins    = Math.max(0, Math.round(totalSeconds / 60));
    const rounded = Math.round(mins / 15) * 15;
    const h       = Math.floor(rounded / 60);
    const q       = rounded % 60; // 0, 15, 30, 45

    if (h === 0 && q === 0) return 'no time';
    const hourPhrase = h === 1 ? 'an hour' : `${h} hours`;

    if (h === 0) {
      return q === 30 ? 'about half an hour' : `about ${q} minutes`;
    }
    if (q === 0)  return `about ${hourPhrase}`;
    if (q === 30) return `about ${hourPhrase} and a half`;
    return `about ${hourPhrase} and ${q} minutes`;
  }

  function formatQueueDuration(totalSeconds, cfg) {
    return cfg.precise_duration
      ? formatDurationPrecise(totalSeconds)
      : formatDurationRounded(totalSeconds);
  }

  function queueInfoHtml(s, cfg) {
    const count    = s.rotation ? s.rotation.length : 0;
    const timeStr  = formatQueueDuration(s.queue_duration_secs || 0, cfg);
    const countTxt = (cfg.count_legend || '{count} singers in the queue').replace('{count}', count);
    const timeTxt  = (cfg.time_legend  || 'about {time} to get through the queue').replace('{time}', timeStr);
    return `<span class="seg"><span class="lbl-info">QUEUE</span>` +
      `<span class="singer-name">${esc(countTxt)}</span>` +
      `<span class="pipe">·</span>` +
      `<span class="song-artist">${esc(timeTxt)}</span></span>`;
  }

  function buildEmptyContent() {
    const nextText  = TICKER_CFG.empty_next_text || 'Your Name Could Be Here';
    const thenItems = (TICKER_CFG.empty_then_text && TICKER_CFG.empty_then_text.length)
      ? TICKER_CFG.empty_then_text
      : ['Just scan the QR code', 'Or Fill Out A Slip'];

    const nextSeg = `<span class="seg"><span class="lbl-next">NEXT</span>` +
      `<span class="singer-name">${esc(nextText)}</span></span>`;

    const thenEntries = thenItems.map(t => `<span class="up-singer">${esc(t)}</span>`).join('<span class="pipe">  </span>');
    const thenSeg = `<span class="seg"><span class="lbl-up">THEN</span>${thenEntries}</span>`;

    return [nextSeg, thenSeg, FAIRNESS_SEG].join('<span class="pipe">◆</span>');
  }

  function buildContent(s) {
    if (!s || s.status === 'not_ready' || s.status === 'database_not_found') {
      return '<span class="seg" style="color:#666">Waiting for kroak-time…</span>';
    }

    const parts     = [];
    const skipNames = new Set();

    if (s.rotation && s.rotation.length > 0) {
      if (shouldShowQueueInfo(TICKER_CFG.queue_info)) {
        parts.push(queueInfoHtml(s, TICKER_CFG.queue_info));
      }

      if (s.is_playing && s.current_singer) {
        const c = s.current_singer;
        parts.push(
          `<span class="seg"><span class="lbl-now">NOW</span>` +
          `<span class="singer-name">${esc(c.name)}</span>${songHtml(c)}</span>`
        );
        skipNames.add(c.name);
      }

      const nextSinger = s.is_playing ? s.next_up : s.current_singer;
      if (nextSinger && !skipNames.has(nextSinger.name) && (TICKER_CFG.show_empty_singers || nextSinger.next_song_title)) {
        parts.push(
          `<span class="seg"><span class="lbl-next">NEXT</span>` +
          `<span class="singer-name">${esc(nextSinger.name)}</span>${songHtml(nextSinger)}</span>`
        );
        skipNames.add(nextSinger.name);
      }

      // kroak-time's own setting (s.singer_count, via /api/state) is the source of
      // truth; 0 there means unlimited. TICKER_CFG.singer_count is a local override
      // that only applies when set >0, to show fewer than kroak-time reports.
      // TICKER_CFG.show_all_singers overrides both and always shows everyone.
      const rest  = s.rotation.filter(r => !skipNames.has(r.name) && (TICKER_CFG.show_empty_singers || r.next_song_title));
      const effectiveCount = TICKER_CFG.show_all_singers
        ? 0
        : (TICKER_CFG.singer_count > 0 ? TICKER_CFG.singer_count : (s.singer_count || 0));
      const shown = effectiveCount > 0
        ? rest.slice(0, Math.max(0, effectiveCount - skipNames.size))
        : rest;

      if (shown.length > 0) {
        const entries = shown.map((r, i) => {
          const num  = i + skipNames.size + 1;
          let   html = `<span class="up-num">${num}.</span><span class="up-singer">${esc(r.name)}</span>`;
          if (r.next_song_title) {
            html += `<span class="up-song">${esc(r.next_song_title)}</span>`;
          }
          return html;
        }).join('<span class="pipe">  </span>');

        parts.push(`<span class="seg"><span class="lbl-up">THEN</span>${entries}</span>`);
      }
    }

    if (parts.length === 0) {
      return buildEmptyContent();
    }

    parts.push(FAIRNESS_SEG);
    return parts.join('<span class="pipe">◆</span>');
  }

  // ── Content update ────────────────────────────────────────────────────────
  const GAP = '<span style="display:inline-block;width:120px"></span>';

  function updateContent() {
    trackSingerAdvance(state);
    const html = buildContent(state);
    // Each copy carries its own trailing gap so halfWidth lands exactly at
    // the start of copy 2, making the loop reset pixel-perfect.
    track.innerHTML = html + GAP + html + GAP;
    pendingLayout = true;
    lastTs        = null; // discard the frame that includes reflow time
  }

  // ── Animation loop ────────────────────────────────────────────────────────
  function animate(ts) {
    if (pendingLayout) {
      const oldHalf = halfWidth;
      halfWidth     = track.scrollWidth / 2;
      pendingLayout = false;
      // Remap scrollX proportionally so position within the loop is preserved.
      if (oldHalf > 0 && halfWidth > 0) {
        scrollX = (scrollX % oldHalf) / oldHalf * halfWidth;
      } else if (halfWidth > 0 && scrollX >= halfWidth) {
        scrollX %= halfWidth;
      }
    }

    if (lastTs !== null && halfWidth > 0) {
      const delta = (ts - lastTs) / 1000;
      scrollX += cfg.speed * delta;
      if (scrollX >= halfWidth) scrollX -= halfWidth;
      track.style.transform = `translateY(-50%) translateX(${-scrollX}px)`;
    }

    lastTs = ts;
    requestAnimationFrame(animate);
  }

  // ── Data fetching ─────────────────────────────────────────────────────────
  async function fetchState() {
    try {
      const r    = await fetch('/api/state');
      const next = await r.json();
      if (JSON.stringify(next) !== JSON.stringify(state)) {
        state = next;
        updateContent();
      }
    } catch (_) {
      // Server temporarily unreachable — keep showing last state.
    }
  }

  requestAnimationFrame(animate);
  fetchState();
  setInterval(fetchState, FETCH_MS);
</script>
</body>
</html>
